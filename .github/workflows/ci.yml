name: CI

# 只响应 push；不使用 pull_request 流程。
on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: smoothup-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 静态链接 MSVC CRT，避免发布包额外依赖 VC++ 可再发行组件。
  # 不影响外部 FFmpeg/RIFE：它们由 setup 单独下载，不进入发布包。
  RUSTFLAGS: "-C target-feature=+crt-static"

jobs:
  check:
    name: Build, test, clippy
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build
        run: cargo build --locked --all-targets

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  package:
    name: Package Windows zip
    needs: check
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build and package
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: smoothup-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tag release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: smoothup-windows-x64
          path: dist

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(
            Get-ChildItem -LiteralPath 'dist' -File |
              Where-Object { $_.Extension -in @('.zip', '.sha256') } |
              ForEach-Object { $_.FullName }
          )
          if ($assets.Count -eq 0) { throw '没有找到发布产物。' }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload 失败：$LASTEXITCODE" }
          }
          else {
            gh release create $tag @assets --verify-tag --generate-notes --title "SmoothUp $tag"
            if ($LASTEXITCODE -ne 0) { throw "gh release create 失败：$LASTEXITCODE" }
          }
