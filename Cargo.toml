[package]
name = "smoothup"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A lightweight high-frame-rate video preparation CLI"
license = "MIT"
repository = "https://github.com/Aelurillus/SmoothUp"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
